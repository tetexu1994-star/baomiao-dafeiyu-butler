name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt

    - name: Run tests
      run: python -m unittest discover -s tests -v

    - name: Build Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed --name="暴喵大肥鱼一键管家" --add-data "web;web" app.py
        pyinstaller --noconfirm --onefile --windowed --name="暴喵大肥鱼一键管家" --add-data "web;web" app.py

    - name: Upload Single EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 暴喵大肥鱼一键管家-Windows-x64
        path: dist/暴喵大肥鱼一键管家.exe

